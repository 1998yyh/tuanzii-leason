# 团子课堂 · Nginx 站点模板（由 deploy.sh 替换占位符后上传）
# __LISTEN_PORT__ → 如 9000
# __WEB_ROOT__    → 如 /var/www/tuanzii

server {
    listen       __LISTEN_PORT__;
    listen       [::]:__LISTEN_PORT__;
    server_name  _;

    root   __WEB_ROOT__;
    index  index.html;

    charset utf-8;

    # 静态站：存在文件就返回，否则回门户首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不长期缓存，便于发版后立刻看到新内容
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS 发版频繁：不长期缓存，部署后立刻生效
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 图片/字体可短缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log  /var/log/nginx/tuanzii.access.log;
    error_log   /var/log/nginx/tuanzii.error.log;
}
